function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return String(s).toLocaleLowerCase('en').replace(/[^a-z0-9]/g,'').trim();}
function speak(t,slow){if(!('speechSynthesis' in window))return notify('Højtlæsning er ikke tilgængelig her. Læs gerne ordet højt.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(t));u.lang='en-GB';u.rate=slow?.73:.88;u.pitch=1.05;let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('en-gb'))||speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u);}
function notify(s,ok){let e=document.getElementById('feedback')||document.getElementById('globalNote');if(e){e.textContent=s;e.classList.toggle('ok',!!ok);e.setAttribute('role','status');}}
function jump(){window.scrollTo({top:0,behavior:'instant'});}
let route={type:'home'},session={};
function navigate(type,id,step){stopRecording();if(window.speechSynthesis)speechSynthesis.cancel();route={type:type,id:id,step:step};session={};render();jump();}
function learning(text,after){return'<div class="learning"><span style="font-size:29px">🦉</span><div><strong>'+ (after?'Du har trænet':'Det skal du træne') +'</strong><p>'+esc(text)+'</p></div></div>';}
function button(s,act,cl,extra){return'<button type="button" class="'+(cl||'action')+'" data-action="'+esc(act)+'" '+(extra||'')+'>'+s+'</button>';}
function header(){return'<header class="top"><a class="brand" href="index.html"><i>🎄</i><span>ENGLISH QUEST <strong>CHRISTMAS</strong><small style="display:block;color:#b74650;font-size:.67rem;letter-spacing:1.4px">3.C · CHRISTMAS ADVENTURES</small></span></a><nav class="nav" aria-label="Menu">'+button('🏠 Forside','home','')+button('🔐 Escape rooms','to-rooms','')+button('🎮 Julespil','to-games','')+button('✍️ Skriveværksted','to-writing','')+button('🌍 Jul i verden','to-world','')+'<a href="index.html">← Almindeligt engelsk</a></nav></header>';}
function doodles(){return'<svg class="doodle one" viewBox="0 0 120 90" aria-hidden="true"><path d="M12 48 Q37 0 66 40 T110 32 M39 14 l7 10 -7 10 -7 -10z M93 59 l4 7 8 2 -8 2 -4 7 -4 -7 -8 -2 8 -2z"/></svg><svg class="doodle two" viewBox="0 0 110 110" aria-hidden="true"><path d="M55 8 v95 M8 55 h94 M22 22 l66 66 M88 22 L22 88 M55 25 l-9 -9 M55 25 l9 -9 M82 55 l12 -10 M82 55 l12 10 M55 83 l-9 10 M55 83 l9 10"/></svg>';}
function getBadges(){let out=[];ROOMS.forEach(r=>{if((state.rooms[r.id]||0)>=5)out.push([r.emoji,r.badge]);});GAMES.forEach(g=>{if(state.games[g.id])out.push([g.icon,g.title]);});if(state.writing.story)out.push(['📖','Story Writer']);if(state.writing.wishes)out.push(['💌','Wish Writer']);if(state.culture>=6)out.push(['🌍','World Traveller']);return out;}
function badges(){let earned=getBadges();return'<div class="progress-strip"><div><strong>🏅 Mine julebadges</strong><div class="count-label">'+earned.length+' optjent · gemmes på denne enhed</div></div><div class="badges">'+(earned.length?earned.map(x=>'<span class="badge">'+x[0]+' '+esc(x[1])+'</span>').join(''):'<span class="badge locked">⭐ Dit første badge venter!</span>')+'</div></div>';}
function cardsRooms(){return'<div class="grid-rooms">'+ROOMS.map(r=>{let p=state.rooms[r.id]||0;return'<article class="room-card"><div class="room-image"><img src="'+IMG[r.scene]+'" alt="3D juleillustration til '+esc(r.title)+'" loading="lazy"><span class="room-number">MISSION '+r.number+'</span></div><div class="room-body"><h3>'+r.emoji+' '+esc(r.title)+'</h3><p>'+esc(r.subtitle)+'</p><div class="room-progress">'+p+' / 5 missioner klaret'+(p===5?' · 🏅 Badge!':'')+'</div><div class="bar" aria-hidden="true"><span style="width:'+(p*20)+'%"></span></div>'+button(p===5?'Spil historien igen':(p?'Fortsæt eventyret':'Start eventyret'),'open-room','action small green','data-id="'+r.id+'"')+'</div></article>';}).join('')+'</div>';}
function cardsGames(){return'<div class="grid-games">'+GAMES.map(g=>'<article class="game-card"><div><span class="game-icon">'+g.icon+'</span><h3>'+esc(g.title)+'</h3><p>'+esc(g.meta)+'</p></div>'+button(state.games[g.id]?'🏅 Spil igen':'🎮 Spil nu','open-game','action small','data-id="'+g.id+'"')+'</article>').join('')+'</div>';}
function home(){return'<div class="page">'+header()+'<section class="hero"><div class="hero-text"><small>❄️ A MAGICAL ENGLISH CHRISTMAS ❄️</small><h1>Christmas <span>Quest!</span></h1><p>Help Ollie, meet the elves and save Christmas. Read, listen, speak, spell and play your way through the snow!</p><div class="actions">'+button('🔑 Start et escape room','to-rooms','action')+button('🎮 Se julespillene','to-games','action secondary')+'</div><div class="pill-row"><span class="pill">3 escape rooms</span><span class="pill">15 English missions</span><span class="pill">8 julespil</span><span class="pill">Badges</span></div></div><div class="hero-art"><img src="'+IMG.workshop+'" alt="Magisk 3D juleværksted i sne"><img class="hero-sticker" src="'+IMG.owl+'" alt="Uglen Ollie, din engelske hjælper"></div>'+doodles()+'</section>'+badges()+'<section class="section" id="rooms"><div class="section-h"><div><span class="kicker">THREE STORIES · FIVE MISSIONS EACH</span><h2>🔐 Christmas Escape Rooms</h2><p class="lead">Tre små juleeventyr på 3. klasses niveau. Der kommer hjælp før opgaven og en faglig opsamling efter. Du skal klare én mission for at åbne den næste.</p></div><span class="sparkle">🔔</span></div>'+cardsRooms()+'</section><section class="section" id="games"><div class="section-h"><div><span class="kicker">PLAY AND LEARN</span><h2>🎮 Christmas Games</h2><p class="lead">Spil dig til engelsk ordforråd, lytning, læsning og samtale. Hvert spil fortæller dig, hvad du træner.</p></div></div>'+cardsGames()+'</section><section class="section" id="writing"><span class="kicker">WRITE A LITTLE ENGLISH</span><h2>✍️ Christmas Writing Studio</h2><p class="lead">Skriv en lille historie eller et brev til Santa. Brug ordhjælpen. Du kan gemme teksten i denne browser eller udskrive den.</p>'+writeCards()+'</section><section class="section" id="world"><span class="kicker">CULTURE & OUTLOOK</span><h2>🌍 Christmas Around the World</h2><p class="lead">Engelsk tales mange steder. Opdag nogle forskellige juletraditioner – og husk, at ikke alle familier fejrer jul.</p>'+worldCards()+'</section><footer>English Quest 3.C · Julespil til engelskundervisningen · Din tekst og fremgang gemmes kun i browseren.<br>Brug høretelefoner ved lytteopgaver. Mikrofon er valgfri. <button data-action="reset" style="border:0;background:transparent;text-decoration:underline;color:#7a4050;cursor:pointer">Nulstil mine julefremskridt</button></footer></div>';}
function writeCards(){return'<div class="desk-row">'+writeItem('story','📖 My Christmas Story','Skriv 3-5 små engelske sætninger. Du bestemmer selv historien.','One cold day... / I see a... / I go to... / I feel... / The end.',['snow','snowman','star','tree','gift','happy','little'])+writeItem('wishes','💌 My Letter to Santa','Skriv et kort julebrev med en venlig begyndelse og slutning.','Dear Santa,\nMerry Christmas!\nI would like ...\nThank you!\nLove, ...',['Dear Santa','please','thank you','I would like','a book','a toy'])+'</div>';}
function writeItem(id,title,info,starter,words){return'<div class="desk"><h3>'+title+'</h3><p>'+esc(info)+'</p>'+learning('Du skriver korte engelske sætninger. Prøv at bruge mindst tre ord fra listen.',false)+'<div class="wordbank">'+words.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div><textarea id="write-'+id+'" aria-label="'+esc(title)+'" placeholder="'+esc(starter)+'">'+esc(state.writing[id+'Text']||'')+'</textarea><div class="actions">'+button('💾 Gem tekst','save-writing','action small green','data-id="'+id+'"')+button('🖨️ Udskriv','print-writing','action small secondary','data-id="'+id+'"')+'</div><div id="writing-note-'+id+'" class="count-label">'+(state.writing[id]?'🏅 '+(id==='story'?'Story Writer':'Wish Writer')+' badge optjent!':'Gem teksten for at få dit skrivebadge.')+'</div></div>';}
function worldCards(){return'<div class="world-grid">'+CULTURE.map((c,i)=>'<article class="culture-card"><span class="flag">'+c.flag+'</span><b>'+esc(c.country)+'</b><p>'+esc(c.fact)+'</p><small>'+esc(c.small)+'</small>'+button('❓ Mini quiz','world-quiz','action small','data-index="'+i+'"')+'</article>').join('')+'</div><div id="worldQuiz" class="culture-quiz" style="display:none"></div><p class="count-label" style="margin-top:15px">'+state.culture+' af 6 landekort klaret. Klar alle seks for et World Traveller-badge.</p>';}
function render(){app.innerHTML=route.type==='room'?renderRoom():route.type==='game'?renderGame():home();}
let currentMission=null;
function currentRoom(){return ROOMS.find(r=>r.id===route.id);}
function renderRoom(){let r=currentRoom();if(!r)return home();let p=state.rooms[r.id]||0;let idx=Number.isInteger(route.step)?route.step:Math.min(p,4);idx=Math.max(0,Math.min(idx,p,4));route.step=idx;let m=r.missions[idx];currentMission=m;
let levels='<div class="level-track" aria-label="Missioner">'+r.missions.map((x,i)=>'<button class="level '+(i<p?'done':i===idx?'current':'')+'" '+(i>p?'disabled':'')+' type="button" data-action="jump-mission" data-index="'+i+'" aria-label="Mission '+(i+1)+(i<p?', klaret':'')+'">'+(i<p?'✓':i+1)+'</button>').join('')+'</div>';
let complete=p>idx;
return'<div class="page">'+header()+'<main class="mission-wrap"><div class="crumb">'+button('← Til juleportalen','home','')+'<strong>'+r.emoji+' '+esc(r.title)+'</strong></div><section class="story-hero"><img src="'+IMG[r.scene]+'" alt="Juleeventyr i 3D"><div><span class="kicker" style="color:#ffdc91">ESCAPE ROOM '+r.number+'</span><h1>'+esc(r.title)+'</h1><p>'+esc(r.intro)+'</p><p style="font-size:.81rem">'+esc(r.introDa)+'</p></div></section>'+levels+'<section class="mission-panel"><span class="mission-tag">Mission '+(idx+1)+' of five · '+esc(m.kind)+'</span><h2>'+esc(m.name)+'</h2>'+learning(m.before,false)+'<div class="storybook">'+esc(m.story)+'</div><h3 class="question">'+esc(m.question)+'</h3>'+ (complete?missionCompleteView(r,m,idx):renderMissionTask(m,idx)) +'</section></main>'+badges()+'</div>';}
function missionCompleteView(r,m,idx){return'<div class="success"><h3>🌟 Well done!</h3><p>'+esc(m.after)+'</p><p>'+ (idx===4?'🎉 You saved the day! You have earned the '+esc(r.badge)+' badge.':'🔓 The next mission is unlocked!')+'</p>'+button(idx===4?'🏠 Til juleportalen':'➡️ Næste mission',idx===4?'home':'next-mission','action green')+'</div>';}
function renderMissionTask(m,idx){if(m.kind==='choice'||m.kind==='listen'){if(!session.choices)session.choices=shuffle(m.options);return(m.audio?'<div class="actions">'+button('🔊 Lyt til ledetråden','speak-mission','action small secondary')+button('🐢 Langsomt','slow-mission','action small secondary')+'</div>':'')+'<div class="choices">'+session.choices.map((s,i)=>'<button class="choice" type="button" data-action="mission-choice" data-index="'+i+'">'+esc(s)+'</button>').join('')+'</div>'+assist(m);}
if(m.kind==='spell')return'<div class="actions">'+button('🔊 Hør ordet','speak-mission','action small secondary')+button('🐢 Langsomt','slow-mission','action small secondary')+'</div><label class="count-label" for="mission-input">Skriv det engelske ord:</label><div class="actions"><input id="mission-input" class="typebox" autocomplete="off" spellcheck="false" aria-label="Skriv det ord, du hørte">'+button('Tjek stavning','check-mission-spell','action small green')+'</div>'+assist(m);
if(m.kind==='order'){if(!session.tiles){session.tiles=shuffle(m.words.map((s,i)=>({s:s,i:i})));session.chosen=[];}return'<div class="count-label">Tryk på ordene i den rigtige rækkefølge.</div><div class="selected-words">'+(session.chosen.length?session.chosen.map((t,i)=>'<button class="tile" data-action="remove-mission-tile" data-index="'+i+'">'+esc(t.s)+' ×</button>').join(''):'<span class="empty">Din sætning vises her ...</span>')+'</div><div class="tiles">'+session.tiles.map((t,i)=>'<button class="tile" data-action="add-mission-tile" data-index="'+i+'" '+(session.chosen.some(x=>x.i===t.i)?'disabled':'')+'>'+esc(t.s)+'</button>').join('')+'</div><div class="actions">'+button('Tjek min sætning','check-mission-order','action small green')+button('Start forfra','clear-mission-order','action small secondary')+'</div>'+assist(m);}
if(m.kind==='pairs'){if(!session.pairs){session.pairs=shuffle(m.pairs.map((p,i)=>({word:p[0],picture:p[1],i:i})));session.pictures=shuffle(m.pairs.map((p,i)=>({word:p[0],picture:p[1],i:i})));session.matched=[];session.first=null;}return'<div class="count-label">Vælg først ordet til venstre. Find derefter billedet til højre.</div><div class="pairs"><div class="paircol">'+session.pairs.map(t=>'<button class="pair '+(session.first===t.i?'selected':'')+' '+(session.matched.includes(t.i)?'matched':'')+'" data-action="choose-word" data-index="'+t.i+'" '+(session.matched.includes(t.i)?'disabled':'')+'>'+esc(t.word)+'</button>').join('')+'</div><div class="paircol">'+session.pictures.map(t=>'<button class="pair '+(session.matched.includes(t.i)?'matched':'')+'" data-action="choose-picture" data-index="'+t.i+'" '+(session.matched.includes(t.i)?'disabled':'')+'><span style="font-size:30px">'+esc(t.picture)+'</span></button>').join('')+'</div></div><p class="count-label">'+session.matched.length+' af '+m.pairs.length+' par fundet.</p>'+assist(m);}
return '<p>Opgaven blev ikke indlæst.</p>';}
function assist(m){return'<p class="feedback" id="feedback" role="status"></p>'+button('💡 Ollies hjælp','show-hint','hint-button')+'<p class="hintbox" id="hint" hidden>'+esc(m.hint)+'</p>';}
function completeMission(){let r=currentRoom(),i=route.step;if((state.rooms[r.id]||0)<=i){state.rooms[r.id]=i+1;save();}render();jump();}
function checkMissionOption(i){let m=currentMission;if(session.choices[i]===m.answer)completeMission();else notify('Prøv igen. Læs eller lyt til ledetråden en gang til.');}
function checkMissionSpell(){let el=document.getElementById('mission-input');if(!el)return;let val=norm(el.value);if(!val){notify('Skriv først et ord.');return;}if(val===norm(currentMission.answer))completeMission();else{notify('Du er tæt på! Hør ordet igen og se på bogstaverne.');el.focus();}}
function checkMissionOrder(){let w=session.chosen||[];if(w.length!==currentMission.words.length){notify('Du mangler nogle ord. Brug alle ordene.');return;}if(w.map(x=>x.s).join(' ')===currentMission.words.join(' '))completeMission();else notify('Prøv en anden rækkefølge. Hvad kommer først?');}
function completeGame(){state.games[route.id]=true;save();session.finished=true;render();jump();}
function startGame(id){navigate('game',id,0);}
function activeGame(){return GAMES.find(g=>g.id===route.id);}
function gameData(){let g=activeGame();if(!g)return[];if(g.id==='listen')return LISTEN.map((a,i)=>({word:a[1],emoji:a[0],choices:shuffle(LISTEN.filter((_,k)=>k!==i)).slice(0,3).concat([a]).sort(()=>Math.random()-.5)}));if(g.id==='spell')return SPELL.map(x=>({word:x}));if(g.id==='sleigh')return SENTENCES.map(x=>({words:x}));if(g.id==='chain')return CHAIN;if(g.id==='shop')return SHOP;return[];}
function renderGame(){let g=activeGame();if(!g)return home();if(!session.data)session.data=gameData();let n=session.step||0;
let top='<div class="page">'+header()+'<main class="game-panel"><div class="crumb">'+button('← Til juleportalen','home','')+'<strong>Christmas Games</strong></div><section class="mission-panel"><div class="game-top"><span>'+g.icon+'</span><div><span class="mission-tag">CHRISTMAS GAME</span><h1>'+esc(g.title)+'</h1></div></div>'+learning(g.train,false);
if(session.finished)return top+'<div class="success"><h3>🏆 Super Christmas work!</h3><p>Du gennemførte '+esc(g.title)+'. Du har trænet: '+esc(g.train.toLowerCase())+'</p><p>Du har fået et julebadge! Det er gemt på denne enhed.</p>'+button('🏠 Til juleportalen','home','action green')+'</div></section></main>'+badges()+'</div>';
let main='';if(g.id==='memory')main=renderMemory();else if(g.id==='hunt')main=renderHunt();else if(g.id==='speak')main=renderSpeaking();else{let data=session.data,q=data[n];if(!q){session.finished=true;return renderGame();}main='<p class="count-label">Runde '+(n+1)+' af '+data.length+'</p>'+renderGameRound(g.id,q,n);}
return top+main+'<p class="feedback" id="feedback" role="status"></p>'+(g.id==='speak'?'<p class="mic-note">Optagelser bliver kun afspillet i browseren. De gemmes ikke og sendes ikke til en server.</p>':'')+'</section></main>'+badges()+'</div>';}
function renderGameRound(id,q,n){if(id==='listen'){if(!session.options)session.options=q.choices;return'<div class="storybook">🎧 Press play. Which picture matches the word?</div><div class="actions">'+button('🔊 Play the word','game-speak','action small secondary')+button('🐢 Slowly','game-slow','action small secondary')+'</div><div class="choices">'+session.options.map((o,i)=>'<button class="choice" data-action="game-choice" data-index="'+i+'"><span class="emoji">'+o[0]+'</span>'+esc(o[1])+'</button>').join('')+'</div>';}
if(id==='spell')return'<p class="question">Listen. Write the Christmas word.</p><div class="actions">'+button('🔊 Play','game-speak','action small secondary')+button('🐢 Slowly','game-slow','action small secondary')+'</div><div class="actions"><input class="typebox" id="game-input" spellcheck="false" autocomplete="off" aria-label="Skriv ordet du hørte">'+button('Tjek ordet','check-game-spell','action green small')+'</div><p class="count-label">Tip: Alle ordene handler om jul eller vinter.</p>';
if(id==='sleigh'){if(!session.tiles){session.tiles=shuffle(q.words.map((s,i)=>({s:s,i:i})));session.chosen=[];}return'<p class="question">Put the words in the right order.</p><div class="selected-words">'+(session.chosen.length?session.chosen.map((x,i)=>'<button class="tile" data-action="remove-game-tile" data-index="'+i+'">'+esc(x.s)+' ×</button>').join(''):'<span class="empty">Tryk på ordene ...</span>')+'</div><div class="tiles">'+session.tiles.map((x,i)=>'<button class="tile" data-action="add-game-tile" data-index="'+i+'" '+(session.chosen.some(y=>y.i===x.i)?'disabled':'')+'>'+esc(x.s)+'</button>').join('')+'</div><div class="actions">'+button('Tjek sætningen','check-game-order','action small green')+button('Start forfra','clear-game-order','action small secondary')+'</div>';}
if(id==='chain'){let last=q.prev.slice(-1).toUpperCase();return'<div class="storybook">Last word: <strong>'+esc(q.prev)+'</strong><br>Find a new English word starting with <strong>'+last+'</strong>.</div><div class="choices">'+q.choices.map((o,i)=>'<button class="choice" data-action="game-choice" data-index="'+i+'">'+esc(o)+'</button>').join('')+'</div>';}
if(id==='shop'){return'<div class="storybook"><strong>Shopkeeper:</strong> '+esc(q.line)+'</div><div class="actions">'+button('🔊 Hør sætningen','game-speak','action small secondary')+'</div><p class="question">What can you say?</p><div class="choices">'+q.choices.map((o,i)=>'<button class="choice" data-action="game-choice" data-index="'+i+'">'+esc(o)+'</button>').join('')+'</div>';}
return'';}
function advanceRound(){session.step=(session.step||0)+1;session.options=null;session.tiles=null;session.chosen=[];let data=session.data||[];if(session.step>=data.length)completeGame();else{render();jump();}}
function checkGameChoice(i){let id=route.id,q=session.data[session.step||0],selected;
if(id==='listen'){selected=session.options[i];if(selected&&selected[1]===q.word){notify('Yes! '+q.word+' · Rigtigt hørt!',true);advanceRound();}else notify('Not quite. Listen again.');}
else if(id==='chain'||id==='shop'){selected=q.choices[i];if(selected===q.correct){notify('Well done!',true);advanceRound();}else notify('Try again. Read the clue carefully.');}}
function checkGameSpell(){let el=document.getElementById('game-input');if(!el)return;let q=session.data[session.step||0];if(norm(el.value)===norm(q.word))advanceRound();else{notify('Prøv igen. Lyt til ordet en gang til.');el.focus();}}
function checkGameOrder(){let q=session.data[session.step||0];if((session.chosen||[]).length!==q.words.length)return notify('Husk at bruge alle ordene.');if(session.chosen.map(x=>x.s).join(' ')===q.words.join(' '))advanceRound();else notify('Tjek din engelske ordstilling og prøv igen.');}
const MEM=[['🎄','tree'],['🔔','bell'],['🎁','gift'],['⭐','star'],['☃️','snowman'],['🦌','reindeer']];
function renderMemory(){if(!session.deck){session.deck=shuffle(MEM.flatMap((m,i)=>[{id:i,face:m[0],pict:true},{id:i,face:m[1],pict:false}]));session.up=[];session.matched=[];session.locked=false;}return'<div class="storybook">🎴 Find a Christmas picture and the right English word.</div><p class="count-label">'+session.matched.length+' af seks par fundet</p><div class="memory-grid">'+session.deck.map((c,i)=>{let show=session.up.includes(i)||session.matched.includes(c.id);return'<button class="memory-card '+(show?'open ':'')+(session.matched.includes(c.id)?'done':'')+'" data-action="flip" data-index="'+i+'" '+(session.matched.includes(c.id)?'disabled':'')+' aria-label="'+(show?esc(c.face):'Vend kort')+'">'+(show?esc(c.face):'❄️')+'</button>';}).join('')+'</div>';}
function flip(i){if(session.locked||session.up.includes(i)||session.matched.includes(session.deck[i].id))return;session.up.push(i);if(session.up.length===2){let a=session.deck[session.up[0]],b=session.deck[session.up[1]];if(a.id===b.id&&a.pict!==b.pict){session.matched.push(a.id);session.up=[];if(session.matched.length===MEM.length){completeGame();return;}}else{session.locked=true;render();setTimeout(function(){if(route.type!=='game'||route.id!=='memory')return;session.up=[];session.locked=false;render();},1000);return;}}render();}
const HUNT_WORDS=[{word:"SNOW",r:0,c:1,d:"H"},{word:"STAR",r:2,c:3,d:"V"},{word:"TREE",r:1,c:6,d:"V"},{word:"GIFT",r:7,c:1,d:"H"},{word:"BELL",r:5,c:6,d:"H"},{word:"SANTA",r:9,c:3,d:"H"}];
function huntBoard(){let grid=Array.from({length:10},(_,r)=>Array.from({length:10},(_,c)=>'CANDYHOLLYM'[ (r*13+c*7)%11 ]));HUNT_WORDS.forEach(x=>{for(let i=0;i<x.word.length;i++)grid[x.r+(x.d==='V'?i:0)][x.c+(x.d==='H'?i:0)]=x.word[i];});return grid;}
function renderHunt(){if(!session.hunt){session.hunt={grid:huntBoard(),found:[],start:null};}let h=session.hunt;return'<div class="storybook">🔎 Find the six Christmas words. Tap the first letter, then the last letter. The words go across → or down ↓.</div><div class="hunt-layout"><div class="word-grid">'+h.grid.map((row,r)=>row.map((c,j)=>{let cell=r+'-'+j,found=HUNT_WORDS.filter(x=>h.found.includes(x.word)).some(w=>{for(let i=0;i<w.word.length;i++)if((w.r+(w.d==='V'?i:0))+'-'+(w.c+(w.d==='H'?i:0))===cell)return true;return false;});return'<button type="button" class="grid-letter '+(h.start===cell?'selected ':'')+(found?'found':'')+'" data-action="hunt-cell" data-r="'+r+'" data-c="'+j+'" aria-label="Række '+(r+1)+' kolonne '+(j+1)+' bogstav '+c+'">'+c+'</button>';}).join('')).join('')+'</div><aside><h3>Find these words</h3><div class="hunt-words">'+HUNT_WORDS.map(w=>'<span class="'+(h.found.includes(w.word)?'found':'')+'">'+w.word+'</span>').join('')+'</div><p class="lead" style="margin-top:17px">Tip: Alle seks ord går vandret mod højre eller lodret nedad.</p>'+button('Nulstil valgt bogstav','hunt-clear','action small secondary')+'</aside></div>';}
function huntCell(r,c){let h=session.hunt,cell=r+'-'+c;if(h.start===null){h.start=cell;render();return;}let start=h.start.split('-').map(Number);h.start=null;let target=HUNT_WORDS.find(w=>(w.r===start[0]&&w.c===start[1]&&w.r+(w.d==='V'?w.word.length-1:0)===r&&w.c+(w.d==='H'?w.word.length-1:0)===c)||(w.r===r&&w.c===c&&w.r+(w.d==='V'?w.word.length-1:0)===start[0]&&w.c+(w.d==='H'?w.word.length-1:0)===start[1]));if(target&&!h.found.includes(target.word)){h.found.push(target.word);if(h.found.length===HUNT_WORDS.length){completeGame();return;}render();notify('⭐ Du fandt '+target.word+'!',true);}else{render();notify('Det var ikke et af ordene. Prøv med første og sidste bogstav igen.');}}
let stream=null,recorder=null,chunks=[],recUrl=null;
function stopRecording(){if(recorder&&recorder.state==='recording'){try{recorder.stop();}catch(e){}}if(stream){stream.getTracks().forEach(x=>x.stop());stream=null;}recorder=null;if(recUrl){URL.revokeObjectURL(recUrl);recUrl=null;}}
const PHRASES=["Merry Christmas!","I can see a green tree.","I like snow.","Thank you, Santa!"];
function renderSpeaking(){let i=session.speaking||0;return'<div class="storybook"><h3>🎤 Speak English!</h3><p>Øv sætningen. Tryk på 🔊, sig den højt, og lyt eventuelt til din egen optagelse. Her er ingen automatisk bedømmelse af udtale.</p></div><p class="count-label">Sætning '+(i+1)+' af '+PHRASES.length+'</p><h2 style="margin:15px 0">'+esc(PHRASES[i])+'</h2><div class="actions">'+button('🔊 Hør Ollie','speak-phrase','action small secondary')+button('⏺️ Start optagelse','record-start','action small')+button('⏹️ Stop','record-stop','action small secondary')+'</div><div id="recordStatus" class="count-label">Du kan også sige sætningen uden optagelse.</div><div id="recordPreview"></div><div class="actions">'+button(i===PHRASES.length-1?'✅ Jeg har øvet alle sætninger':'➡️ Jeg har sagt sætningen','next-phrase','action green')+'</div>';}
async function startRecording(){stopRecording();if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)return notify('Mikrofonoptagelse er ikke tilgængelig her. Sig sætningen højt uden optagelse.');try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onstop=()=>{if(!chunks.length)return;recUrl=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));let wrap=document.getElementById('recordPreview');if(wrap)wrap.innerHTML='<audio class="recording" controls src="'+recUrl+'" aria-label="Afspil din optagelse"></audio>';};recorder.start();let status=document.getElementById('recordStatus');if(status)status.textContent='🎙️ Optager...';}catch(e){notify('Mikrofonen blev ikke åbnet. Sig bare sætningen højt uden optagelse.');}}
function stopCapture(){if(recorder&&recorder.state==='recording'){recorder.stop();if(stream){stream.getTracks().forEach(x=>x.stop());stream=null;}let e=document.getElementById('recordStatus');if(e)e.textContent='Afspil optagelsen nedenfor.';}}
function finishWriting(id){let e=document.getElementById('write-'+id);if(!e)return;let value=e.value.trim();if(value.length<18){let note=document.getElementById('writing-note-'+id);note.textContent='Skriv lidt mere først – gerne mindst tre korte engelske sætninger.';return;}state.writing[id]=true;state.writing[id+'Text']=value.slice(0,5000);save();let note=document.getElementById('writing-note-'+id);note.textContent='✅ Gemt på denne enhed. Du har øvet engelsk skrivning og fået et badge!';}
function printWriting(id){let e=document.getElementById('write-'+id);if(!e)return;let w=window.open('','_blank');if(!w)return notify('Tillad pop op-vinduer, hvis du vil udskrive.');w.document.write('<!doctype html><html lang="en"><meta charset="utf-8"><title>My Christmas Writing</title><body style="font-family:sans-serif;padding:35px;line-height:1.8"><h1>'+ (id==='story'?'My Christmas Story':'My Letter to Santa')+'</h1><div style="white-space:pre-wrap">'+esc(e.value)+'</div></body></html>');w.document.close();w.focus();w.print();}
function showCulture(i){let card=CULTURE[i];let box=document.getElementById('worldQuiz');if(!box)return;box.style.display='block';session.cultureIndex=i;box.innerHTML='<p class="count-label">MINI QUIZ · '+esc(card.country)+'</p><h3>'+esc(card.q)+'</h3><div class="choices">'+card.options.map((s,j)=>'<button class="choice" data-action="culture-answer" data-index="'+j+'">'+esc(s)+'</button>').join('')+'</div><p id="feedback" class="feedback" role="status"></p>';}
function answerCulture(i){let c=CULTURE[session.cultureIndex];if(c.options[i]===c.answer){state.culture=Math.max(state.culture||0,0);state.cultureFlags=state.cultureFlags||{};state.cultureFlags[session.cultureIndex]=true;state.culture=Object.keys(state.cultureFlags).length;save();let box=document.getElementById('worldQuiz');box.innerHTML='<div class="success"><h3>🌍 Well done!</h3><p>'+esc(c.fact)+'</p><p>Du trænede at læse om kultur på engelsk.</p>'+button('Tilbage til kortene','to-world','action small green')+'</div>';}else notify('Prøv igen. Læs faktateksten på kortet.');}
function reset(){if(!window.confirm('Vil du nulstille alle julemissioner, badges og tekster i denne browser?'))return;state=initState();save();navigate('home');}
function action(ev){let b=ev.target.closest('button[data-action]');if(!b)return;let a=b.dataset.action,idx=Number(b.dataset.index||0),id=b.dataset.id;
if(a==='home')return navigate('home');
if(a==='to-rooms'||a==='to-games'||a==='to-writing'||a==='to-world'){navigate('home');requestAnimationFrame(()=>document.getElementById(({ 'to-rooms':'rooms','to-games':'games','to-writing':'writing','to-world':'world'})[a])?.scrollIntoView({block:'start'}));return;}
if(a==='open-room')return navigate('room',id,Math.min(state.rooms[id]||0,4));
if(a==='open-game')return startGame(id);
if(a==='jump-mission'){if(idx<=(state.rooms[route.id]||0))navigate('room',route.id,Math.min(idx,4));return;}
if(a==='next-mission')return navigate('room',route.id,Math.min((route.step||0)+1,4));
if(a==='mission-choice')return checkMissionOption(idx);
if(a==='check-mission-spell')return checkMissionSpell();
if(a==='check-mission-order')return checkMissionOrder();
if(a==='add-mission-tile'){if(session.chosen&&!session.chosen.some(x=>x.i===session.tiles[idx].i)){session.chosen.push(session.tiles[idx]);render();}return;}
if(a==='remove-mission-tile'){session.chosen.splice(idx,1);render();return;}
if(a==='clear-mission-order'){session.chosen=[];render();return;}
if(a==='choose-word'){session.first=idx;render();return;}
if(a==='choose-picture'){if(session.first==null)return notify('Vælg først et engelsk ord til venstre.');if(idx===session.first){session.matched.push(idx);session.first=null;if(session.matched.length===currentMission.pairs.length)return completeMission();render();notify('Yes! Du fandt et par.',true);}else{session.first=null;render();notify('Prøv igen: Hvilket billede passer til ordet?');}return;}
if(a==='speak-mission'||a==='slow-mission'){speak(currentMission.audio||currentMission.story,a==='slow-mission');return;}
if(a==='show-hint'){let e=document.getElementById('hint');if(e)e.hidden=!e.hidden;return;}
if(a==='game-choice')return checkGameChoice(idx);
if(a==='game-speak'||a==='game-slow'){let d=session.data[session.step||0],target=route.id==='shop'?d.line:d.word;speak(target,a==='game-slow');return;}
if(a==='check-game-spell')return checkGameSpell();
if(a==='add-game-tile'){if(session.chosen&&!session.chosen.some(x=>x.i===session.tiles[idx].i)){session.chosen.push(session.tiles[idx]);render();}return;}
if(a==='remove-game-tile'){session.chosen.splice(idx,1);render();return;}
if(a==='check-game-order')return checkGameOrder();
if(a==='clear-game-order'){session.chosen=[];render();return;}
if(a==='flip')return flip(idx);
if(a==='hunt-cell')return huntCell(Number(b.dataset.r),Number(b.dataset.c));
if(a==='hunt-clear'){session.hunt.start=null;render();return;}
if(a==='speak-phrase')return speak(PHRASES[session.speaking||0]);
if(a==='record-start')return startRecording();
if(a==='record-stop')return stopCapture();
if(a==='next-phrase'){stopRecording();session.speaking=(session.speaking||0)+1;if(session.speaking>=PHRASES.length)return completeGame();render();return;}
if(a==='save-writing')return finishWriting(id);
if(a==='print-writing')return printWriting(id);
if(a==='world-quiz')return showCulture(idx);
if(a==='culture-answer')return answerCulture(idx);
if(a==='reset')return reset();}
document.addEventListener('click',action);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='mission-input'){e.preventDefault();checkMissionSpell();}if(e.key==='Enter'&&e.target.id==='game-input'){e.preventDefault();checkGameSpell();}});
window.addEventListener('pagehide',stopRecording);
render();
})();</script></body></html>
